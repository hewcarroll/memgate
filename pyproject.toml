[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memgate"
version = "0.1.0"
description = "Gated cross-attention memory layers for transformers (kNN-LM / RETRO / memorizing-transformer style), with a pluggable retrieval backend."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Hew Carroll" }]
keywords = ["pytorch", "transformer", "memory", "cross-attention", "retrieval", "knn-lm", "retro"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/hewcarroll/memgate"
Repository = "https://github.com/hewcarroll/memgate"

[tool.hatch.build.targets.wheel]
packages = ["src/memgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
